[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-trace-observer"
version = "0.1.0"
description = "External profiling lifecycle observers for RL frameworks"
requires-python = "==3.12.*"
dependencies = [
    # 0.9 adds verl.plugins entry point discovery and the RL-Insight hooks used here.
    # verl-core holds what running verl.trainer.main_ppo needs (TransferQueue, ...).
    # Exact: the plugin patches private trainer and profiler methods of this release.
    "verl[verl-core]==0.9.1",
    "rl-insight",
    "viztracer>=0.16",
]

[project.optional-dependencies]
# Kernel wheels exist only for Linux. TokenSpeed comes from our fork (see
# [tool.uv.sources]); its python package needs the kernel nightly built from
# the same upstream commit.
tokenspeed = [
    "tokenspeed; sys_platform == 'linux'",
    "tokenspeed-kernel==0.1.3.post20260930; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["perfetto", "pytest>=8", "pyyaml", "ruff>=0.12"]

[project.scripts]
rl-trace-merge = "rl_trace_observer.merger.cli:main"

[project.entry-points."verl.plugins"]
rl-trace-observer = "rl_trace_observer.integrations.verl.register"

[tool.uv.sources]
# RL_INSIGHT_SERVER_BACKEND is on main (verl-project/rl-insight#190) but in no
# release yet; uv.lock pins the commit.
rl-insight = { git = "https://github.com/verl-project/rl-insight", branch = "main" }
# Fork of TokenSpeed main at 76fc28f (the 0.1.0.post20260930 nightly) with
# Proton profiles under CUDA graphs, background profile writes and the torch
# 2.14 weight-update group fix, until they land upstream. Never force-push this
# branch: uv.lock pins its commit.
tokenspeed = { git = "https://github.com/Luosuu/tokenspeed", branch = "tianle/rl-trace", subdirectory = "python" }

# TokenSpeed kernel nightlies (and nightlies of the other tokenspeed-* packages
# they need); main's VizTracer reports carry the scope-entry flows that link
# Python slices to Proton CPU scopes, which the 0.1.0 release lacks.
[[tool.uv.index]]
name = "tokenspeed-nightly"
url = "https://lightseek.org/whl/nightly"

[tool.uv]
# tokenspeed pins transformers==5.12.0 while verl 0.9.1 declares
# transformers<5.11. Both must share one environment, so force tokenspeed's pin.
override-dependencies = ["transformers==5.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]
