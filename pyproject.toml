[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-trace-observer"
version = "0.1.0"
description = "External profiling lifecycle observers for RL frameworks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 0.9 adds verl.plugins entry point discovery and the RL-Insight hooks used here.
verl = ["verl>=0.9.1"]
tokenspeed = ["tokenspeed"]
rl-insight = ["rl-insight>=0.2.1"]
viztracer = ["viztracer>=0.16"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.entry-points."verl.plugins"]
rl-trace-observer = "rl_trace_observer.integrations.verl.register"

[tool.uv.sources]
# uv installs the fork that adds RL_INSIGHT_SERVER_BACKEND until it lands
# upstream (branch tianle/server-backend-env). pip users get the PyPI release,
# which still works through the default-backend tee.
rl-insight = { git = "https://github.com/Luosuu/rl-insight", rev = "72763beecf2c9652ad182ba83ce9104417a70d1e" }

[tool.uv]
# tokenspeed 0.1.0 pins transformers==5.12.0 while verl 0.9.1 declares
# transformers<5.11. Both must share one environment, so force tokenspeed's pin.
override-dependencies = ["transformers==5.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]
