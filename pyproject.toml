[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-trace-observer"
version = "0.1.0"
description = "External profiling lifecycle observers for RL frameworks"
requires-python = "==3.12.*"
dependencies = [
    # 0.9 adds verl.plugins entry point discovery and the RL-Insight hooks used here.
    # verl-core holds what running verl.trainer.main_ppo needs (TransferQueue, ...).
    "verl[verl-core]>=0.9.1",
    "rl-insight",
    "viztracer>=0.16",
]

[project.optional-dependencies]
# Kernel wheels exist only for Linux.
tokenspeed = ["tokenspeed==0.1.0.post20261001; sys_platform == 'linux'"]

[dependency-groups]
dev = ["perfetto", "pytest>=8", "pyyaml", "ruff>=0.12"]

[project.scripts]
rl-trace-merge = "rl_trace_observer.merger.cli:main"

[project.entry-points."verl.plugins"]
rl-trace-observer = "rl_trace_observer.integrations.verl.register"

[tool.uv.sources]
# Fork adding RL_INSIGHT_SERVER_BACKEND (branch tianle/server-backend-env),
# required until it lands upstream.
rl-insight = { git = "https://github.com/Luosuu/rl-insight", rev = "72763beecf2c9652ad182ba83ce9104417a70d1e" }

# TokenSpeed nightly builds of main: its VizTracer reports carry the scope-entry
# flows that link Python slices to Proton CPU scopes, which the 0.1.0 release
# lacks. Each nightly needs the tokenspeed-kernel nightly of the same date, which
# needs further tokenspeed-* nightlies; the index holds only tokenspeed packages.
[[tool.uv.index]]
name = "tokenspeed-nightly"
url = "https://lightseek.org/whl/nightly"

[tool.uv]
# tokenspeed pins transformers==5.12.0 while verl 0.9.1 declares
# transformers<5.11. Both must share one environment, so force tokenspeed's pin.
override-dependencies = ["transformers==5.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]
