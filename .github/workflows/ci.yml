name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      # The runner's /tmp is a small tmpfs (7.9 GB), and Ray's session
      # directory with its worker environments outgrows it; keep it on the
      # root disk, under a short path (Ray's socket paths are length-limited).
      RAY_TMPDIR: /home/runner/ray
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # CPU-only, including multi-process tests on VERL's real single controller.
      - run: uv sync --locked --extra tokenspeed
      - name: Install Perfetto trace_processor
        env:
          PERFETTO_VERSION: v50.1
        run: |
          curl -sSfL -o /tmp/perfetto.zip \
            "https://github.com/google/perfetto/releases/download/${PERFETTO_VERSION}/linux-amd64.zip"
          unzip -q /tmp/perfetto.zip -d /tmp/perfetto
          chmod +x /tmp/perfetto/linux-amd64/trace_processor_shell
          echo "PERFETTO_TRACE_PROCESSOR=/tmp/perfetto/linux-amd64/trace_processor_shell" >> "$GITHUB_ENV"
      - run: uv run --no-sync pytest -q -rs --basetemp="$RUNNER_TEMP/pytest"
      - name: Disk usage
        if: always()
        run: |
          df -h / /tmp "$RUNNER_TEMP" || true
          du -sh "$RAY_TMPDIR" "$RUNNER_TEMP/pytest" ~/.cache/uv "$GITHUB_WORKSPACE/.venv" 2>/dev/null || true
          du -sk "$RUNNER_TEMP"/pytest/* "$RAY_TMPDIR"/ray/session_*/runtime_resources/* 2>/dev/null | sort -rn | head -15 || true
      # Keep the full main_ppo and Ray worker logs of a failed run.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ runner.temp }}/pytest/**/*.log
            /home/runner/ray/ray/session_*/logs/
          if-no-files-found: ignore
          retention-days: 7
